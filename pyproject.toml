[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pr_review_eval"
version = "0.1.0"
description = "Evaluating AI pull request review agents with Inspect AI"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "inspect_ai",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pr_review_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "network: test needs internet access",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
strict = true
files = ["src", "tests"]
